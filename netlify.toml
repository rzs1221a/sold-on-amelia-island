[build]
publish = "/"

# Lead ingestion runs as a function. Dependencies (zod / resend / blobs) are
# installed from package.json at deploy time; the site itself stays build-free.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# Friendly path for the lead endpoint.
[[redirects]]
from = "/api/leads"
to = "/.netlify/functions/lead-submit"
status = 200
force = true

# Proxy BoldTrail property-alert email links through to the BoldTrail-served
# host so they resolve on this domain instead of 404ing. These must stay
# above any future catch-all redirect since Netlify matches top-down.
[[redirects]]
from = "/details/*"
to = "https://ameliaisland.heymannwilliams.com/details/:splat"
status = 200
force = true

[[redirects]]
from = "/search/*"
to = "https://ameliaisland.heymannwilliams.com/search/:splat"
status = 200
force = true

[[redirects]]
from = "/property/*"
to = "https://ameliaisland.heymannwilliams.com/property/:splat"
status = 200
force = true

# Security + caching headers
[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"
  # PRE-LAUNCH: strongest de-indexing signal — applies to every response,
  # including assets and any crawler that ignores robots.txt. Delete this
  # line to go public.
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
