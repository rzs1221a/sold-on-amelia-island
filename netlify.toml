[build]
publish = "/"

# Lead ingestion runs as a function. Dependencies (zod / resend / blobs) are
# installed from package.json at deploy time; the site itself stays build-free.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# The apex is the only address this site answers on. Without this, the
# netlify.app alias serves a complete second copy that browsers,
# crawlers, and shared links can get stuck on.
[[redirects]]
from = "https://soldonameliaisland.netlify.app/*"
to = "https://soldonameliaisland.com/:splat"
status = 301
force = true

# Friendly path for the lead endpoint.
[[redirects]]
from = "/api/leads"
to = "/.netlify/functions/lead-submit"
status = 200
force = true

# Proxy BoldTrail property-alert email links through to the BoldTrail-served
# host so they resolve on this domain instead of 404ing. These must stay
# above any future catch-all redirect since Netlify matches top-down.
[[redirects]]
from = "/details/*"
to = "https://ameliaisland.heymannwilliams.com/details/:splat"
status = 200
force = true

[[redirects]]
from = "/search/*"
to = "https://ameliaisland.heymannwilliams.com/search/:splat"
status = 200
force = true

[[redirects]]
from = "/property/*"
to = "https://ameliaisland.heymannwilliams.com/property/:splat"
status = 200
force = true

# Security + caching headers
[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Assets revalidate via ETag instead of being cached as immutable: images on
# this site ARE replaced in place (CMS uploads, headshot/photo swaps), and an
# immutable year-long cache made Safari keep serving old photos after a swap.
# A 304 revalidation is cheap; a visitor staring at last month's headshot
# isn't. If a fingerprinted-asset pipeline is ever added, immutable can come
# back for the fingerprinted paths only.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
